<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daleel: search Quran, hadith and scholars' views</title>
<meta name="description" content="Search the Quran, hadith and scholars' views. Every result is cited and linked to its source.">
<meta name="theme-color" content="#10243A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Newsreader:wght@400;600&family=Noto+Nastaliq+Urdu&family=Noto+Sans+Devanagari&family=Noto+Sans+Telugu&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#10243A; --paper:#F4F6F3; --card:#FFFFFF; --line:#D3DAD4;
  --green:#0E6B5C; --lapis:#1F4E8C; --gold:#A87B1E; --muted:#56667A;
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  --arabic:'Amiri','Traditional Arabic','Scheherazade New',serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:18px;line-height:1.55}
body[data-lang=ur] .tr,body[data-lang=ur] .ui{font-family:'Noto Nastaliq Urdu',var(--arabic);line-height:2.1}
body[data-lang=ar] .ui{font-family:var(--arabic)}
body[data-lang=hi] .tr,body[data-lang=hi] .ui{font-family:'Noto Sans Devanagari',var(--serif)}
body[data-lang=te] .tr,body[data-lang=te] .ui{font-family:'Noto Sans Telugu',var(--serif)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:820px;margin:0 auto;padding:0 20px}

header{background:var(--ink);color:#F4F6F3;padding:14px 0 30px}
.topbar{display:flex;justify-content:flex-end;margin-bottom:14px}
.topbar label{display:flex;align-items:center;gap:10px;font-size:16px;color:#C5D0DC}
.topbar select{font-size:17px;padding:7px 10px;border:1px solid #F4F6F3;background:#F4F6F3;color:var(--ink);font-weight:600}
.brand{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
.brand .ar{font-family:var(--arabic);font-size:clamp(64px,16vw,104px);line-height:1.05;font-weight:700;color:#fff}
.brand .en{font-size:26px;font-weight:600;letter-spacing:.01em;color:#D9C48F}
.tag{margin:6px 0 22px;max-width:34em;color:#C5D0DC;font-size:18px}

form{display:flex;gap:8px}
input[type=search]{flex:1;min-width:0;font:inherit;font-size:19px;padding:14px 16px;border:2px solid transparent;border-radius:6px;background:#fff;color:var(--ink)}
button{font:inherit;cursor:pointer}
.go{padding:0 22px;border:0;border-radius:6px;background:var(--gold);color:#fff;font-weight:600;font-size:18px}
.go:hover{background:#8F6716}

details.settings{margin:18px 0 0;color:#C5D0DC;font-size:16px}
details.settings summary{cursor:pointer;width:max-content}
.setrow{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:12px;align-items:center}
.setrow label{display:flex;gap:6px;align-items:center}
select,input[type=password]{font:inherit;font-size:16px;max-width:100%;padding:6px 8px;border-radius:5px;border:1px solid #4A6178;background:#fff;color:var(--ink)}
.hint{font-size:14px;color:#9FB0C2;margin:6px 0 0;max-width:40em}

main{padding:28px 0 60px}
.notice{border-inline-start:4px solid var(--gold);background:#FBF6E8;padding:10px 14px;font-size:16px;margin:0 0 24px}
.status{color:var(--muted);min-height:1.6em}
section{margin-top:36px}
section>h2{font-size:24px;margin:0 0 4px;display:flex;align-items:baseline;gap:10px}
section>h2 .n{font-size:16px;font-weight:400;color:var(--muted)}
.sub{color:var(--muted);font-size:15px;margin:0 0 14px}

.ai{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--ink);border-radius:4px;padding:16px 20px 8px}
.aihead b{font-size:22px;display:block}
.aihead span{display:block;font-size:15px;color:var(--muted);margin:2px 0 8px}
.aibody h3{font-size:18px;margin:16px 0 4px}
.aibody p{margin:0 0 10px;max-width:42em}
.aibody ul{margin:0 0 10px;padding-inline-start:22px;max-width:42em}
.cite{display:inline-block;font-size:13px;font-weight:600;line-height:1.5;color:#fff;background:var(--lapis);border-radius:4px;padding:0 6px;margin:0 2px;text-decoration:none;font-family:var(--serif)}
.cite[href^="#c-Q"]{background:var(--green)}

.card{background:var(--card);border:1px solid var(--line);border-inline-start:5px solid var(--green);border-radius:4px;padding:16px 18px;margin:0 0 14px}
.card.h{border-inline-start-color:var(--lapis)}
.card.flash{box-shadow:0 0 0 3px var(--gold)}
.card .arabic{direction:rtl;text-align:right;font-family:var(--arabic);font-size:27px;line-height:2;margin:0 0 8px}
.card .tr{margin:0 0 10px;max-width:42em}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:15px;color:var(--muted)}
.meta strong{color:var(--ink);font-weight:600}
.meta a{color:var(--lapis)}
.chip{padding:1px 9px;border-radius:999px;border:1px solid var(--line);font-size:14px;background:#F4F6F3;color:var(--ink)}
.chip.sahih{border-color:var(--green);color:var(--green)}
.chip.hasan{border-color:var(--gold);color:#7A5710}
.chip.daif{border-color:#A33;color:#A33}
.chip.cid{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
.src{font-size:13px;color:var(--muted);margin-top:6px}

.scholar{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.scholar a{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:14px 16px;border-top:4px solid var(--gold)}
.scholar a:hover{background:#FBFAF4}
.scholar b{display:block;font-size:19px}
.scholar span{font-size:14px;color:var(--muted)}
.empty{color:var(--muted);padding:6px 0;margin:0}
footer{border-top:1px solid var(--line);padding:22px 0 40px;font-size:14px;color:var(--muted)}
@media (max-width:520px){body{font-size:17px}.go{padding:0 14px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body data-lang="en">

<header>
  <div class="wrap">

<main class="wrap">

  <section id="sh" hidden><h2 class="ui"><span id="hh"></span><span class="n" id="nh"></span></h2><p class="sub ui" id="subh"></p><div id="rh"></div></section>
  <section id="ss" hidden><h2 class="ui" id="hs"></h2><p class="sub ui" id="subs"></p><div class="scholar" id="rs"></div></section>
</main>

<footer>
  <div class="wrap">
    Quran and hadith text come from the open fawazahmed0 datasets (jsDelivr CDN). Links open quran.com, sunnah.com and the scholar sites. Always verify before relying on a result.
  </div>
</footer>

const aiCache = new Map();
const $ = s => document.querySelector(s);
const t = k => (UI[lang] && UI[lang][k]) || UI.en[k];
const h = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v; else e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null) e.append(c);
  return e;
};
const jsonCache = new Map();
function getJSON(url) {
  if (!jsonCache.has(url)) {
    jsonCache.set(url, fetch(url).then(r => { if (!r.ok) throw new Error(r.status + ' ' + url); return r.json(); })
      .catch(e => { jsonCache.delete(url); throw e; }));
  }
  return jsonCache.get(url);
}
function norm(s) {
  return String(s).normalize('NFKD')
    .replace(/[\u0300-\u036f\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g, '')
    .replace(/[إأآٱ]/g, 'ا').replace(/ك/g, 'ک').replace(/[يىئ]/g, 'ی').replace(/[ةہۃھ]/g, 'ه')
    .toLowerCase();
}
function tokenize(q, code) {
  const stop = new Set((STOP[code] || []).map(norm));
  return norm(q).split(/[^\p{L}\p{N}\p{M}]+/u).filter(w => w.length >= 2 && !stop.has(w))
    .map(w => (/^[a-z]+$/.test(w) && w.length > 3 && w.endsWith('s') && !w.endsWith('ss')) ? w.slice(0, -1) : w);
}
function rank(norms, tokens, limit) {
  const N = norms.length;
  const w = tokens.map(tok => { let c = 0; for (const x of norms) if (x.includes(tok)) c++; return c ? Math.log(1 + N / c) : 0; });
  const out = [];
  for (let i = 0; i < N; i++) {
    let s = 0, m = 0;
    for (let k = 0; k < tokens.length; k++) if (w[k] && norms[i].includes(tokens[k])) { s += w[k]; m++; }
    if (m) out.push([s * (1 + m / tokens.length), i]);
  }
  out.sort((a, b) => b[0] - a[0]);
  return out.slice(0, limit);
}
const normCache = new Map();
function normsFor(key, arr, getText) {
  if (!normCache.has(key)) normCache.set(key, arr.map(x => norm(getText(x) || '')));
  return normCache.get(key);
}
const entriesOf = obj => Array.isArray(obj) ? obj.map(v => [v.name, v]) : Object.entries(obj);

/* Work out which language the person typed the question in, from its script */
function detectLang(q) {
  if (/[\u0C00-\u0C7F]/.test(q)) return 'te';
  if (/[\u0900-\u097F]/.test(q)) return 'hi';
  if (/[\u0600-\u06FF]/.test(q)) return (/[ٹڈڑںےھکگچپژیہ]/.test(q) || lang === 'ur') ? 'ur' : 'ar';
  if (/[ñ¿¡áéíóúü]/i.test(q) || /\b(el|la|los|las|qué|cómo|puede|para|que)\b/i.test(q)) return 'es';
  return lang === 'es' ? 'es' : 'en';
}

/* ---------- Editions ---------- */
async function ensureEditions() {
  if (!qEds) qEds = Object.fromEntries(entriesOf(await getJSON(CDN_Q + 'editions.json')));
  if (!hEds) hEds = await getJSON(CDN_H + 'editions.json');
}
function editionsFor(api) {
  return Object.entries(qEds || {}).filter(([k, v]) => String(v.language).toLowerCase() === api && !/-la$/.test(k));
}
function defaultQuranKey(code) {
  let list = editionsFor(LANGS[code].api);
  if (!list.length) list = editionsFor('english');
  return (list.find(([k]) => k === PREF[code]) || list[0] || [null])[0];
}
function arabicQuranKey() {
  const ks = editionsFor('arabic').map(([k]) => k);
  return ks.includes(PREF.ar) ? PREF.ar : (ks.find(k => k.startsWith('ara-quran')) || ks[0]);
}
function pickHadithEdition(book, api) {
  const c = (hEds[book] && hEds[book].collection) || [];
  return c.find(x => String(x.language).toLowerCase() === api) || null;
}
function hadithEdition(book, code) {
  const ed = pickHadithEdition(book, LANGS[code].api);
  if (ed) return {ed, fallback: false};
  return {ed: pickHadithEdition(book, 'english'), fallback: true};
}

/* ---------- UI wiring ---------- */
function fillPageLangs() {
  const sel = $('#plang'); sel.textContent = '';
  for (const [code, L] of Object.entries(LANGS)) sel.append(h('option', {value: code, lang: code, text: L.label}));
  sel.value = lang;
  sel.onchange = () => setLang(sel.value);
}
function renderBooks() {
  const box = $('#books'); box.textContent = '';
  box.append(h('span', {text: t('books') + ':'}));
  for (const b of BOOKS) {
    const cb = h('input', {type:'checkbox', value:b}); cb.checked = selBooks.has(b);
    cb.onchange = () => { cb.checked ? selBooks.add(b) : selBooks.delete(b); };
    box.append(h('label', {}, cb, BOOK_NAMES[b]));
  }
}
function applyStrings() {
  const L = LANGS[lang];
  document.documentElement.lang = lang; document.documentElement.dir = L.dir;
  document.body.dataset.lang = lang;
  $('#tplabel').textContent = t('translatePage') + ':'; $('#plang').setAttribute('aria-label', t('translatePage'));
  $('#tag').textContent = t('tag'); $('#q').placeholder = t('ph'); $('#q').setAttribute('aria-label', t('ph'));
  $('#go').textContent = t('go'); $('#disc').textContent = t('disc');
  $('#setlabel').textContent = t('settings'); $('#trlabel').textContent = t('translation') + ':';
  $('#keylabel').textContent = t('key') + ':'; $('#savelabel').textContent = t('save'); $('#keyhint').textContent = t('keyhint');
  $('#keyrow').hidden = !!AI_ENDPOINT; $('#keyhint').hidden = !!AI_ENDPOINT;
  $('#hq').textContent = t('quran'); $('#hh').textContent = t('hadith'); $('#hs').textContent = t('scholars');
  $('#subh').textContent = t('subh'); $('#subs').textContent = t('subs');
  $('#aititle').textContent = t('aiTitle'); $('#ainote').textContent = t('aiNote');
  $('#plang').value = lang; renderBooks();
}
async function fillTranslations() {
  const sel = $('#tred'); sel.textContent = '';
  try { await ensureEditions(); } catch (e) { return; }
  let list = editionsFor(LANGS[lang].api);
  if (!list.length) list = editionsFor('english');
  for (const [k, v] of list) sel.append(h('option', {value:k, text: (v.author || v.name || k)}));
  sel.value = defaultQuranKey(lang) || (list[0] && list[0][0]);
  trKey = sel.value;
  sel.onchange = () => { trKey = sel.value; if (last) render(++runId); };
}
/* Translate the whole page: interface, Quran and hadith text, and the AI explanation */
async function setLang(code) {
  lang = code; applyStrings();
  if (last) $('#status').textContent = t('translating');
  await fillTranslations();
  if (last) render(++runId);
}

/* ---------- Search (finds references) ---------- */
async function search(q) {
  const id = ++runId;
  const sLang = detectLang(q);
  const tokens = tokenize(q, sLang);
  for (const s of ['sq','sh','ss']) $('#' + s).hidden = false;
  $('#sai').hidden = true;
  for (const e of ['#rq','#rh','#nq','#nh']) $(e).textContent = '';
  $('#status').textContent = t('loading');
  renderScholars(q);
  last = null;
  if (!tokens.length) { $('#status').textContent = t('none'); return; }
  let errs = 0;
  try {
    await ensureEditions();
    const bad = () => { errs++; return []; };
    const [qRefs, hRefs] = await Promise.all([searchQuran(tokens, sLang).catch(bad), searchHadith(tokens, sLang).catch(bad)]);
    if (id !== runId) return;
    if (errs === 2) { $('#status').textContent = t('err'); return; }
    last = {q, sLang, qRefs, hRefs, passages: []};
    await render(id);
  } catch (e) { console.error(e); if (id === runId) $('#status').textContent = t('err'); }
}
async function searchQuran(tokens, sLang) {
  const key = (sLang === lang && trKey) ? trKey : defaultQuranKey(sLang);
  const d = await getJSON(CDN_Q + 'editions/' + key + '.min.json');
  const verses = d.quran;
  return rank(normsFor('q:' + key, verses, v => v.text), tokens, 10).map(([, i]) => ({c: verses[i].chapter, v: verses[i].verse}));
}
async function searchHadith(tokens, sLang) {
  const all = [];
  await Promise.all(BOOKS.filter(b => selBooks.has(b)).map(async book => {
    const {ed} = hadithEdition(book, sLang); if (!ed) return;
    const list = (await getJSON(CDN_H + 'editions/' + ed.name + '.min.json')).hadiths || [];
    for (const [s, i] of rank(normsFor('h:' + ed.name, list, x => x.text), tokens, 10)) all.push({s, book, n: list[i].hadithnumber});
  }));
  all.sort((a, b) => b.s - a.s);
  return all.slice(0, 10);
}

/* ---------- Render (shows the found references in the page language) ---------- */
function gradeClass(g) {
  g = String(g).toLowerCase();
  if (g.includes('sahih')) return 'sahih'; if (g.includes('hasan')) return 'hasan';
  if (g.includes('daif') || g.includes("da'if") || g.includes('weak') || g.includes('mawdu')) return 'daif'; return '';
}
const MAX_CITED = 6;   // how many passages of each kind are given to the AI

async function render(id) {
  const {q, qRefs, hRefs} = last;
  const passages = [];
  for (const e of ['#rq','#rh']) $(e).textContent = '';
  $('#nq').textContent = qRefs.length ? '(' + qRefs.length + ')' : '';
  $('#nh').textContent = hRefs.length ? '(' + hRefs.length + ')' : '';
  $('#status').textContent = t('loading');
  await Promise.allSettled([renderQuran(id, qRefs, passages), renderHadith(id, hRefs, passages)]);
  if (id !== runId) return;
  $('#status').textContent = '';
  last.passages = passages;
  aiBlock(id, q, passages);
}

async function renderQuran(id, refs, passages) {
  const box = $('#rq');
  try {
    if (!refs.length) { box.append(h('p', {class:'empty ui', text: t('none')})); return; }
    const key = trKey || defaultQuranKey(lang), arKey = arabicQuranKey();
    const [tr, ar] = await Promise.all([getJSON(CDN_Q + 'editions/' + key + '.min.json'), getJSON(CDN_Q + 'editions/' + arKey + '.min.json')]);
    if (id !== runId) return;
    const trMap = new Map(tr.quran.map(v => [v.chapter + ':' + v.verse, v.text]));
    const arMap = new Map(ar.quran.map(v => [v.chapter + ':' + v.verse, v.text]));
    const ed = qEds[key] || {};
    const isAr = String(ed.language).toLowerCase() === 'arabic';
    if (!editionsFor(LANGS[lang].api).length) box.append(h('p', {class:'sub ui', text: t('fbq')}));
    refs.forEach((r, idx) => {
      const ref = r.c + ':' + r.v;
      const cid = idx < MAX_CITED ? 'Q' + (idx + 1) : null;
      const text = isAr ? arMap.get(ref) : trMap.get(ref);
      if (cid) passages.push({id: cid, ref: 'Quran ' + ref, grade: null, text: (text || arMap.get(ref) || '').slice(0, 700)});
      const meta = h('div', {class:'meta'});
      if (cid) meta.append(h('span', {class:'chip cid', text: cid}));
      meta.append(h('strong', {text: 'Quran ' + ref}),
        h('a', {href:'https://quran.com/' + r.c + '/' + r.v, target:'_blank', rel:'noopener', text: t('open') + ' quran.com'}));
      box.append(h('article', cid ? {class:'card', id:'c-' + cid} : {class:'card'},
        h('p', {class:'arabic', lang:'ar', dir:'rtl', text: arMap.get(ref) || ''}),
        isAr ? null : h('p', {class:'tr', dir: ed.direction === 'rtl' ? 'rtl' : 'ltr', text: text || ''}),
        meta, h('div', {class:'src', text: ed.author || ed.name || key})));
    });
  } catch (e) { console.error(e); if (id === runId) box.append(h('p', {class:'empty ui', text: t('err')})); }
}

async function renderHadith(id, refs, passages) {
  const box = $('#rh');
  try {
    if (!refs.length) { box.append(h('p', {class:'empty ui', text: t('none')})); return; }
    const books = [...new Set(refs.map(r => r.book))];
    const maps = {}, notes = new Set();
    await Promise.all(books.map(async book => {
      const {ed, fallback} = hadithEdition(book, lang);
      if (!ed) return;
      if (fallback) notes.add(t('fb').replace('%b', BOOK_NAMES[book]));
      const d = await getJSON(CDN_H + 'editions/' + ed.name + '.min.json');
      maps[book] = {ed, map: new Map((d.hadiths || []).map(x => [String(x.hadithnumber), x]))};
    }));
    if (id !== runId) return;
    for (const n of notes) box.append(h('p', {class:'sub ui', text: n}));
    const needAr = [];
    let idx = 0;
    for (const r of refs) {
      const m = maps[r.book]; const hd = m && m.map.get(String(r.n)); if (!hd) continue;
      const ed = m.ed, isAr = String(ed.language).toLowerCase() === 'arabic';
      const cid = idx < MAX_CITED ? 'H' + (idx + 1) : null; idx++;
      const grades = (hd.grades || []).map(g => g.grade + (g.name ? ' (' + g.name + ')' : ''));
      if (cid) passages.push({id: cid, ref: (BOOK_NAMES[r.book] || r.book) + ', hadith ' + r.n, grade: grades.join('; ') || 'not given', text: String(hd.text || '').slice(0, 700)});
      const arP = isAr ? null : h('p', {class:'arabic', lang:'ar', dir:'rtl', 'data-book': r.book, 'data-n': r.n});
      if (arP) needAr.push(arP);
      const meta = h('div', {class:'meta'});
      if (cid) meta.append(h('span', {class:'chip cid', text: cid}));
      meta.append(h('strong', {text: (BOOK_NAMES[r.book] || r.book) + ', ' + t('hadithWord') + ' ' + r.n}));
      for (const g of (hd.grades || [])) meta.append(h('span', {class:'chip ' + gradeClass(g.grade), text: t('grade') + ': ' + g.grade + (g.name ? ' (' + g.name + ')' : '')}));
      meta.append(h('a', {href:'https://sunnah.com/' + r.book + ':' + r.n, target:'_blank', rel:'noopener', text: t('open') + ' sunnah.com'}));
      const attrs = cid ? {class:'card h', id:'c-' + cid} : {class:'card h'};
      box.append(h('article', attrs, arP,
        h('p', isAr ? {class:'arabic', lang:'ar', dir:'rtl', text: hd.text} : {class:'tr', dir: ed.direction === 'rtl' ? 'rtl' : 'ltr', text: hd.text}),
        meta, h('div', {class:'src', text: ed.author || ed.name})));
    }
    for (const book of new Set(needAr.map(p => p.dataset.book))) {
      const aEd = pickHadithEdition(book, 'arabic'); if (!aEd) continue;
      getJSON(CDN_H + 'editions/' + aEd.name + '.min.json').then(d => {
        const map = new Map((d.hadiths || []).map(x => [String(x.hadithnumber), x.text]));
        for (const p of needAr) if (p.dataset.book === book) p.textContent = map.get(p.dataset.n) || '';
      }).catch(() => {});
    }
  } catch (e) { console.error(e); if (id === runId) box.append(h('p', {class:'empty ui', text: t('err')})); }
}

function renderScholars(q) {
  const box = $('#rs'); box.textContent = '';
  for (const s of SCHOLAR_SITES) {
    const url = 'https://duckduckgo.com/?q=' + encodeURIComponent(q + ' site:' + s.domain);
    box.append(h('a', {href:url, target:'_blank', rel:'noopener'}, h('b', {text: s.name}), h('span', {text: s.note})));
  }
}

/* ---------- AI explanation (grounded in the passages shown on the page) ---------- */
function getKey() { try { return localStorage.getItem('daleel_ai_key') || sessionStorage.getItem('daleel_ai_key') || ''; } catch (e) { return ''; } }
const hasAI = () => !!(AI_ENDPOINT || getKey());

function buildPrompt(q, passages, code) {
  const system =
`You are a research assistant inside an app that searches Islamic sources. You explain what the PROVIDED passages say, for an ordinary reader.
Rules:
1. Use ONLY the numbered passages. Never quote or cite Quran, hadith or scholars from memory, and never invent references.
2. Support every claim with the passage ids in square brackets, such as [Q2] or [H1][H3]. Use only ids that appear in the passages.
3. If the passages do not really answer the question, say so plainly instead of stretching them.
4. Hadith grades are given where known. Mention the grade when it affects how much weight a hadith carries. If no grade is given, say the grade is not given.
5. Scholars' opinions and the schools of law (madhhabs) are NOT in the passages. Do not state what any school or scholar holds. You may say that jurists have discussed the topic and that the reader should consult the scholar links on the page.
6. Do not issue a fatwa or tell the reader what is permitted or forbidden in their personal situation. Describe what the texts say.
7. Write in ${LANGS[code].name}. Keep the passage ids exactly as given, in Latin letters.
Format: short sections whose headings start with "## ": Summary; What the Quran says; What the hadith say; Things to keep in mind. Leave out a section if there is nothing for it. Under 350 words. Plain text only, no bold.`;
  const user = 'Question: ' + q + '\n\nPassages:\n' + passages.map(p => '[' + p.id + '] ' + p.ref + (p.grade ? ' (grade: ' + p.grade + ')' : '') + '\n' + p.text).join('\n\n');
  return {system, user};
}
async function callAI(q, passages, code) {
  if (AI_ENDPOINT) {
    const r = await fetch(AI_ENDPOINT, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({query: q, language: code, passages})});
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || r.status);
    return d.text;
  }
  const {system, user} = buildPrompt(q, passages, code);
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{'content-type':'application/json', 'x-api-key': getKey(), 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true'},
    body: JSON.stringify({model: AI_MODEL, max_tokens: 1000, system, messages:[{role:'user', content:user}]})
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error((d.error && d.error.message) || r.status);
  return (d.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
}
async function aiBlock(id, q, passages) {
  const sec = $('#sai'), body = $('#aibody');
  if (!passages.length) { sec.hidden = true; return; }
  sec.hidden = false; body.textContent = '';
  if (!hasAI()) { body.append(h('p', {class:'ui empty', text: t('aiOff')})); return; }
  const ck = q + '|' + lang + '|' + passages.map(p => p.id + p.ref).join(',');
  let text = aiCache.get(ck);
  if (!text) {
    body.append(h('p', {class:'ui empty', text: t('aiWriting')}));
    try { text = await callAI(q, passages, lang); }
    catch (e) { console.error(e); if (id === runId) { body.textContent = ''; body.append(h('p', {class:'ui empty', text: t('aiErr') + ' ' + e.message})); } return; }
    if (id !== runId) return;
    aiCache.set(ck, text);
  }
  body.textContent = '';
  fillAI(body, text, new Set(passages.map(p => p.id)));
}
/* Turn the AI text into safe DOM. Only citation ids that really exist become links; any other id is dropped. */
function fillAI(box, text, valid) {
  let ul = null;
  for (const raw of text.replace(/\*\*/g, '').split('\n')) {
    const line = raw.trim(); let m;
    if (!line) { ul = null; continue; }
    if ((m = line.match(/^#{1,4}\s+(.*)/))) { ul = null; box.append(h('h3', {}, ...cites(m[1], valid))); }
    else if ((m = line.match(/^[-*\u2022]\s+(.*)/))) { if (!ul) { ul = h('ul'); box.append(ul); } ul.append(h('li', {}, ...cites(m[1], valid))); }
    else { ul = null; box.append(h('p', {}, ...cites(line, valid))); }
  }
}
function cites(str, valid) {
  const out = [], re = /\[((?:[QH]\d+)(?:\s*[,;]\s*[QH]\d+)*)\]/g;
  let pos = 0, m;
  while ((m = re.exec(str))) {
    out.push(str.slice(pos, m.index));
    for (const id of m[1].split(/\s*[,;]\s*/)) if (valid.has(id)) out.push(citeLink(id));
    pos = re.lastIndex;
  }
  out.push(str.slice(pos));
  return out;
}
function citeLink(id) {
  const a = h('a', {class:'cite', href:'#c-' + id, text: id});
  a.onclick = e => {
    e.preventDefault();
    const el = document.getElementById('c-' + id);
    if (el) { el.scrollIntoView({behavior:'smooth', block:'center'}); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1800); }
  };
  return a;
}

/* ---------- Start ---------- */
$('#f').addEventListener('submit', e => { e.preventDefault(); const q = $('#q').value.trim(); if (q) search(q); });
$('#aikey').value = getKey();
$('#aisave').checked = (() => { try { return !!localStorage.getItem('daleel_ai_key'); } catch (e) { return false; } })();
function saveKey() {
  const k = $('#aikey').value.trim();
  try {
    localStorage.removeItem('daleel_ai_key'); sessionStorage.removeItem('daleel_ai_key');
    if (k) ($('#aisave').checked ? localStorage : sessionStorage).setItem('daleel_ai_key', k);
  } catch (e) {}
  if (last && last.passages.length) aiBlock(runId, last.q, last.passages);
}
$('#aikey').addEventListener('change', saveKey); $('#aisave').addEventListener('change', saveKey);
fillPageLangs(); applyStrings(); fillTranslations();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
